<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>PRIME · Tracker Deportivo GPS</title>
    <link rel="manifest" href="./manifest.json?v=15" />
    <meta name="theme-color" content="#0D0D10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=15" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg?v=15" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png?v=15" />
    <style id="splash-style">
      #prime-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0D0D10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        transition: opacity 0.32s ease, visibility 0.32s ease;
      }
      #prime-splash.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-emblem {
        width: 124px;
        height: 124px;
        object-fit: contain;
        display: block;
        margin-bottom: 18px;
        filter: drop-shadow(0 10px 26px rgba(57, 255, 20, 0.28));
      }
      .splash-wordmark {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 40px;
        font-weight: 900;
        letter-spacing: 0.12em;
        padding-left: 0.12em;
        line-height: 1;
        color: #FFFFFF;
        margin: 0 0 10px 0;
      }
      .splash-wordmark span {
        color: #39FF14;
      }
      .splash-tagline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.24em;
        padding-left: 0.24em;
        color: #00F0FF;
        text-transform: uppercase;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="prime-splash" aria-label="PRIME · Tracker Deportivo GPS">
      <img class="splash-emblem" src="./logo.png?v=15" width="124" height="124" alt="PRIME" />
      <div class="splash-wordmark" aria-hidden="true">PRIM<span>E</span></div>
      <p class="splash-tagline">TRACKER DEPORTIVO GPS</p>
    </div>
    <script>
      (function () {
        var s = document.getElementById('prime-splash');
        if (!s) return;
        var hide = function () {
          if (!s.classList.contains('hide')) {
            s.classList.add('hide');
            setTimeout(function () {
              if (s.parentNode) s.remove();
            }, 350);
          }
        };
        s.addEventListener('click', hide);
        var qs = new URLSearchParams(window.location.search);
        if (qs.get('testCollection') || qs.get('athlete')) {
          s.remove();
          return;
        }
        setTimeout(hide, 750);
      })();

      // PWA Service Worker Registration & Auto-Update (LoveDater Architecture)
      if ('serviceWorker' in navigator && !new URLSearchParams(window.location.search).get('testCollection')) {
        var swRegistration = null;
        var isRefreshing = false;

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!isRefreshing && !window.__PRIME_RUN_ACTIVE__) {
            isRefreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('./sw.js')
            .then(function (reg) {
              swRegistration = reg;
              if (swRegistration) swRegistration.update().catch(function () {});
            })
            .catch(function () {});
        });

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible' && swRegistration) {
            swRegistration.update().catch(function () {});
          }
        });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
